name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo
          coverage: none

      - run: composer install --prefer-dist --no-progress --no-interaction

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpunit
